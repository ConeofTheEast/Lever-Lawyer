<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2233">
<title>Lever Lawyer</title>
<style>
:root{--bg:#141a28;--panel:#1d2536;--ink:#f3efe4;--mute:#a9b3c7;--gold:#f2c14e;--gold2:#d49a1f;--red:#d64550;--teal:#2bb3a3;--blue:#4a7bd8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center}
#stageWrap{position:relative;flex:none;aspect-ratio:1000/640;width:min(100vw,calc((100vh - 190px)*1.5625));width:min(100vw,calc((100dvh - 190px)*1.5625));background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:6px;padding:6px;pointer-events:none}
#hud>*{pointer-events:auto}
#chip{background:rgba(20,26,40,.8);border:1px solid #ffffff22;border-radius:999px;padding:4px 10px;font-size:clamp(11px,2.6vw,14px);line-height:1.3;white-space:nowrap}
#hbtns{display:flex;gap:6px}
.hb{background:rgba(20,26,40,.8);color:var(--ink);border:1px solid #ffffff33;border-radius:999px;min-height:34px;min-width:34px;padding:0 12px;font-size:14px;cursor:pointer}
#panel{flex:1;min-height:0;width:100%;max-width:1000px;background:var(--panel);border-top:3px solid var(--gold2);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;overflow:auto}
#who{align-self:flex-start;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--blue);color:#fff}
#say{font-size:clamp(14px,3.6vw,18px);line-height:1.35}
#info{font-size:clamp(12px,3vw,14px);color:var(--mute);line-height:1.35}
#info b{color:var(--ink)}
#acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
button.btn{background:#2c3852;color:var(--ink);border:1px solid #ffffff2a;border-radius:10px;padding:10px 14px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
button.btn.primary{background:linear-gradient(#f6cd68,#d9a02a);color:#2a1d00;border-color:#b07d12}
button.btn.good{background:#1f7a62;border-color:#2bb39a}
button.btn.bad{background:#8a2a33;border-color:#c64b57}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn:active:not(:disabled){transform:translateY(1px)}
@media (min-aspect-ratio:19/10){
  #app{flex-direction:row;align-items:stretch}
  #stageWrap{width:calc(100vh*1.5625);width:calc(100dvh*1.5625);height:100vh;height:100dvh;align-self:center}
  #panel{max-width:none;border-top:0;border-left:3px solid var(--gold2)}
}
#modal{position:fixed;inset:0;background:rgba(8,10,18,.82);display:flex;align-items:center;justify-content:center;z-index:10;padding:10px}
#modal.hidden{display:none}
.card{background:var(--panel);border:2px solid var(--gold2);border-radius:16px;max-width:760px;width:100%;max-height:calc(100dvh - 20px);overflow:auto;padding:16px 18px;box-shadow:0 20px 60px #000a}
.card h2{margin:0 0 6px;font-size:22px;color:var(--gold)}
.card h3{margin:14px 0 6px;font-size:15px;color:var(--gold)}
.card p,.card li{font-size:15px;line-height:1.45;color:var(--ink)}
.card .sub{color:var(--mute);font-size:13px}
.menuBtns{display:grid;gap:8px;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs .btn{flex:1}
.tabs .btn.on{background:var(--gold2);color:#2a1d00}
.cust{display:flex;gap:14px;flex-wrap:wrap}
.cust canvas{background:linear-gradient(#cdb98f,#9b7648);border-radius:12px;border:2px solid #0006;width:150px;height:188px;flex:none}
#opts{flex:1;min-width:230px}
.grp{margin-bottom:8px}
.grp label{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{min-width:40px;min-height:38px;padding:0 10px;border-radius:10px;border:2px solid #ffffff2a;background:#2c3852;color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit}
.chip2.on{border-color:var(--gold);box-shadow:0 0 0 2px #f2c14e55}
.sw{width:38px;height:38px;border-radius:50%;padding:0}
.shop{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#2a344c;border-radius:12px;padding:8px 10px}
.item .nm{flex:1;font-weight:600;font-size:14px}
.item .pc{color:var(--gold);font-size:13px}
.item .dot{width:26px;height:26px;border-radius:6px;border:2px solid #0006;flex:none}
.bar{height:10px;background:#101624;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2bb39a,#7ce0c6)}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st td,table.st th{padding:6px 4px;text-align:left}
.txt{width:100%;background:#101624;color:var(--ink);border:1px solid #ffffff33;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
select.txt{width:auto}
table.dec td,table.dec th{font-size:12px;padding:4px 6px;white-space:nowrap;text-align:center}
table.dec td:first-child,table.dec th:first-child{text-align:left}
.h-r{background:#8a2a33}.h-a{background:#8a6a1e}.h-g{background:#1f7a62}
.cli{display:flex;align-items:center;gap:8px;background:#2a344c;border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:14px}
.cli span{flex:1}
dl{margin:0}dt{font-weight:700;color:var(--gold);margin-top:8px}dd{margin:2px 0 0;font-size:14.5px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div id="hud"><div id="chip"></div><div id="hbtns"><button class="hb" id="bSnd" aria-label="Sound">🔊</button><button class="hb" id="bMenu">☰ Menu</button></div></div>
  </div>
  <div id="panel"><div id="who"></div><div id="say"></div><div id="info"></div><div id="acts"></div></div>
</div>
<div id="modal" class="hidden"></div>

<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const cv=$('#cv');let c=cv.getContext('2d');
const SW=1000,SH=640;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(h,f){const n=parseInt(h.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;
  if(f<1){r*=f;g*=f;b*=f}else{const k=f-1;r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}
function ell(x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2)}
const ord=['','1st','2nd','3rd'];

/* ================= data ================= */
const SKINS=['#fde0c8','#f3c9a5','#e2b07e','#c68a58','#a56b3f','#8a5530','#6a3d21','#472614'];
const HAIRC=['#1b1b1b','#4a2c17','#8a5a2b','#c9a24a','#b5361f','#8e8e94','#3b5bdb','#e64980'];
const HAIRS=['Bald','Short','Long','Bun','Curly','Swoop'];
const EYES=['Round','Wide','Narrow','Glasses'];
const BROWS=['Flat','Arched','Bold'];
const NOSES=['Dot','Line','Round'];
const MOUTHS=['Smile','Neutral','Grin','Smirk'];
const SUITS=[
 {id:'drab',name:'Drab Grey Suit',cost:0,jacket:'#77736a',shirt:'#d9d5c9',tie:'#8c8470'},
 {id:'navy',name:'Navy Suit',cost:80,jacket:'#1f3a6b',shirt:'#f1f1f1',tie:'#b3202a'},
 {id:'pin',name:'Pinstripe Suit',cost:160,jacket:'#2b2d36',shirt:'#f1f1f1',tie:'#6b4bb8',stripe:'#9a9fb5'},
 {id:'burg',name:'Burgundy Power Suit',cost:260,jacket:'#6b1230',shirt:'#f6efe4',tie:'#d4af37'},
 {id:'gold',name:'Golden Counsel Suit',cost:450,jacket:'#17171c',shirt:'#ffffff',tie:'#d4af37',trim:'#e8c34f'}];
const MATS=[
 {id:'wood',name:'Wooden See-saw',cost:0,beam:'#a8763e',dark:'#74481f',lite:'#c4935a',w:'#8a8f99'},
 {id:'bronze',name:'Bronze-plated See-saw',cost:120,beam:'#c8823a',dark:'#80491a',lite:'#e9a85c',w:'#c8823a'},
 {id:'silver',name:'Silver-plated See-saw',cost:300,beam:'#c3cad6',dark:'#7d8696',lite:'#eef2f8',w:'#c3cad6'},
 {id:'gold',name:'Gold-plated See-saw',cost:600,beam:'#f1c232',dark:'#a97a0c',lite:'#ffe27a',w:'#f1c232'}];

/* Each claim is a sham: with the TRUE lever arrangement the effort torque is smaller than the load torque.
   Teaching model: slots on the see-saw are 10 cm apart -> class 1 MA=1, class 2 MA=2, class 3 MA=0.5. */
const BASE_CLAIMS=[
 {id:'tiptoe',joint:'Ankle (standing on tiptoes)',cls:2,E:60,L:170,
  say:"Your Honor, the accused stood on their tippy toes to reach the escape hatch from the vault... while carrying ALL of the gold!",
  F:'Ball of the foot (metatarsophalangeal joint)',Ef:'Calf muscles pulling through the Achilles tendon',Lo:'Body weight (plus the gold) acting down through the ankle'},
 {id:'biceps',joint:'Elbow (biceps curl)',cls:3,E:20,L:26,
  say:"The evidence is clear! The accused lifted the heavy gold bar to shoulder height with one arm, hand at the end of the forearm!",
  F:'Elbow joint',Ef:'Biceps pulling on the forearm just below the elbow',Lo:'Weight of the gold bar plus the forearm, held in the hand'},
 {id:'neck',joint:'Neck (tilting the head back)',cls:1,E:25,L:40,
  say:"The accused balanced a sack of gold on their forehead, then tipped the head back to peer up through the skylight!",
  F:'Atlanto-occipital joint (skull on the top vertebra)',Ef:'Neck extensor muscles pulling on the back of the skull',Lo:'Weight of the face and the gold, in front of the joint'},
 {id:'knee',joint:'Knee (extension / kick)',cls:3,E:40,L:60,
  say:"The accused kicked the vault door open while wearing boots filled with gold!",
  F:'Knee joint',Ef:'Quadriceps pulling through the patellar tendon just below the knee',Lo:'Weight of the lower leg, boot and gold at the foot'},
 {id:'triceps',joint:'Elbow (triceps extension)',cls:1,E:30,L:50,
  say:"The accused locked out one elbow and shoved up a hatch piled high with gold bars, using only the triceps!",
  F:'Elbow joint',Ef:'Triceps pulling on the olecranon behind the joint',Lo:'The hatch and gold pressing down on the hand'},
 {id:'pushup',joint:'Whole body (push-up)',cls:2,E:50,L:130,
  say:"The accused cranked out a push-up with the whole stack of gold strapped to their back!",
  F:'Toes touching the floor',Ef:'Triceps and chest muscles pushing through the hands',Lo:'Body weight (plus gold) acting at the centre of mass'},
 {id:'shoulder',joint:'Shoulder (raising the arm sideways)',cls:3,E:22,L:30,
  say:"The accused held two heavy bags of gold straight out to the sides at arm's length, like wings!",
  F:'Shoulder (glenohumeral) joint',Ef:'Deltoid pulling on the upper arm close to the joint',Lo:'Weight of the arm and the gold bag held out in the hand'},
 {id:'hipbal',joint:'Hip (balancing on one leg)',cls:1,E:35,L:60,
  say:"The accused balanced on one leg on the narrow ledge, with a gold-stuffed backpack, without even wobbling!",
  F:'Hip joint of the standing leg',Ef:'Hip abductor muscles (gluteus medius) pulling on the pelvis',Lo:'Body weight and backpack acting through the centre of mass'},
 {id:'pushoff',joint:'Ankle (push-off from the toes)',cls:2,E:70,L:190,
  say:"The accused launched off the toes of one foot to leap the wall, shoulders loaded with gold!",
  F:'Ball of the foot (toes on the ground)',Ef:'Calf muscles pulling through the Achilles tendon',Lo:'Body weight and the gold, pressing down through the ankle'},
 {id:'hipflex',joint:'Hip (lifting the leg)',cls:3,E:35,L:45,
  say:"The accused swung a leg, wrapped in gold chains, up and over the wall in one smooth motion!",
  F:'Hip joint',Ef:'Hip flexors (iliopsoas) pulling on the upper thigh',Lo:'Weight of the leg and the gold chains, centred below the knee'},
 {id:'jaw',joint:'Jaw (clamping the teeth)',cls:3,E:30,L:40,
  say:"The accused dangled a heavy gold bar from their mouth, clamped between the teeth, all the way across the room!",
  F:'Temporomandibular joint (jaw hinge)',Ef:'Masseter and temporalis pulling on the jaw near the hinge',Lo:'Weight of the gold bar gripped between the teeth'},
 {id:'rope',joint:'Elbow (hanging / climbing)',cls:3,E:30,L:20,
  say:"The accused pulled themselves up the rope, hand over hand, with a sack of gold on one arm!",
  F:'Elbow joint',Ef:'Biceps and brachialis pulling on the forearm near the elbow',Lo:'Body weight and the gold pulling on the hand'},
 {id:'dorsi',joint:'Ankle (lifting the toes up)',cls:3,E:18,L:20,
  say:"The accused hooked the toes under the museum case and hoisted it clear off the floor, using only the shin muscle!",
  F:'Ankle joint',Ef:'Tibialis anterior pulling on the top of the foot',Lo:'Weight of the foot and the case, at the toes'},
 {id:'museum',joint:'Ankle (tiptoe walking)',cls:2,E:55,L:160,
  say:"The accused crept silently along the gallery on tiptoes, cradling a solid gold statue in both arms!",
  F:'Ball of the foot (metatarsophalangeal joint)',Ef:'Calf muscles pulling through the Achilles tendon',Lo:'Body weight and the statue, pressing down through the ankle'},
 {id:'wrist',joint:'Wrist (flexing / flicking)',cls:3,E:16,L:24,
  say:"The accused flicked the wrist and sent a sack of gold coins flying onto the top shelf!",
  F:'Wrist joint',Ef:'Wrist flexor muscles pulling on the hand near the joint',Lo:'Weight of the hand and the sack, far from the wrist'},
 {id:'trunk',joint:'Spine (arching the back)',cls:1,E:30,L:55,
  say:"The accused lay flat on the floor and arched the whole trunk off the ground with a gold chest strapped on top!",
  F:'Vertebral joints of the lower back',Ef:'Erector spinae muscles pulling behind the spine',Lo:'Weight of the head, arms and trunk in front of the joint'},
 {id:'sprint',joint:'Ankle (sprint start)',cls:2,E:65,L:180,
  say:"The accused exploded off the starting blocks onto the toes, a pack of gold on their back, and cleared the fence in a single stride!",
  F:'Ball of the foot (toes on the blocks)',Ef:'Calf muscles pulling through the Achilles tendon',Lo:'Body weight and the gold pack, through the ankle'},
 {id:'hamstring',joint:'Knee (bending the leg)',cls:3,E:36,L:50,
  say:"The accused hooked a heel under the gate latch and curled the leg up to flip it, with a gold anklet on each foot!",
  F:'Knee joint',Ef:'Hamstrings pulling on the back of the lower leg just below the knee',Lo:'Weight of the lower leg, foot and the gold anklet'},
 {id:'headbal',joint:'Neck (balancing a load on the head)',cls:1,E:28,L:45,
  say:"The accused balanced a tower of gold plates on the head while gazing up at the clock, without a single wobble!",
  F:'Atlanto-occipital joint (skull on the top vertebra)',Ef:'Neck extensor muscles pulling at the back of the skull',Lo:'Weight of the face and the plates in front of the joint'},
 {id:'stairs',joint:'Ankle (climbing on the toes)',cls:2,E:62,L:175,
  say:"The accused bounded up the clocktower stairs on the toes of both feet, a gold-filled backpack on their shoulders!",
  F:'Ball of the foot (toes on the stair)',Ef:'Calf muscles pulling through the Achilles tendon',Lo:'Body weight and the backpack, through the ankle'},
 {id:'throw',joint:'Elbow (overhead extension)',cls:1,E:28,L:48,
  say:"The accused held a gold bar overhead and snapped the elbow straight with the triceps alone, hurling it over the fence!",
  F:'Elbow joint',Ef:'Triceps pulling on the olecranon behind the joint',Lo:'Weight of the forearm and the bar, beyond the joint'},
 {id:'skip',joint:'Ankle (skipping rope)',cls:2,E:58,L:165,
  say:"The accused skipped rope on the toes for ten minutes, with a belt of gold bars around the waist!",
  F:'Ball of the foot (toes on the ground)',Ef:'Calf muscles pulling through the Achilles tendon',Lo:'Body weight and the gold belt, through the ankle'}
];
let CLAIMS=BASE_CLAIMS.slice();
function rebuildClaims(){CLAIMS=BASE_CLAIMS.concat((S&&S.custom)||[])}
const MIDDLE={1:'Fulcrum',2:'Load',3:'Effort'};
const CASES=['The Case of the Golden Sack','The Curious Vault Affair','The Hatch Incident','The Gilded Ladder','The Midnight Climb','The Rooftop Affair','The Lantern Lane Matter','The Marble Hall Mystery','The Brass Key Business','The Clocktower Question'];
const SP=10; // cm between slots
const RANKS=[[0,'Law Student'],[100,'Junior Associate'],[300,'Attorney'],[700,'Senior Counsel'],[1500,'Legendary Litigator']];

/* ================= save (localStorage + cookie backup) ================= */
const KEY='leverLawyerSave_v1';
const DEF=()=>({created:false,look:{skin:2,hair:1,hairCol:1,eyes:0,brows:1,nose:0,mouth:0},suit:'drab',mat:'wood',
  ownS:['drab'],ownM:['wood'],rep:0,fame:0,level:1,best:0,stats:{1:{ok:0,bad:0},2:{ok:0,bad:0},3:{ok:0,bad:0}},quiz:{ok:0,bad:0},recall:{1:{ok:0,bad:0},2:{ok:0,bad:0},3:{ok:0,bad:0}},name:'',custom:[],muted:false});
let S=DEF();
function load(){let s=null;
  try{s=localStorage.getItem(KEY)}catch(e){}
  if(!s){try{const m=document.cookie.match(new RegExp('(?:^|; )'+KEY+'=([^;]*)'));if(m)s=decodeURIComponent(m[1])}catch(e){}}
  if(s){try{const o=JSON.parse(s);const d=DEF();S=Object.assign(d,o);S.look=Object.assign(d.look,o.look||{});S.stats=Object.assign(d.stats,o.stats||{});S.recall=Object.assign(d.recall,o.recall||{});if(!Array.isArray(S.custom))S.custom=[]}catch(e){S=DEF()}}rebuildClaims()}
function save(){const s=JSON.stringify(S);
  try{localStorage.setItem(KEY,s)}catch(e){}
  try{document.cookie=KEY+'='+encodeURIComponent(s)+';max-age=31536000;path=/;SameSite=Lax'}catch(e){}}

/* ================= sound ================= */
let ac=null;
function tone(f,d,type,v,when,to){if(S.muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={
 place(){tone(300,.08,'triangle',.1)},
 gavel(){tone(140,.18,'square',.18,0,60);tone(120,.2,'square',.14,.22,50)},
 cheer(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.1,i*.09))},
 gasp(){tone(500,.4,'sawtooth',.07,0,200)},
 obj(){tone(880,.12,'square',.1);tone(660,.2,'square',.1,.12)},
 bad(){tone(200,.5,'sawtooth',.1,0,90)},
 thud(){tone(90,.25,'sine',.25,0,40)},
 pick(){tone(520,.05,'sine',.08)}};

/* ================= faces / people ================= */
function randLook(){return {skin:rnd(8),hair:rnd(6),hairCol:rnd(8),eyes:rnd(4),brows:rnd(3),nose:rnd(3),mouth:rnd(4)}}
const CASUAL=['#5b7fb8','#b85b5b','#6aa36a','#c9a24a','#8a6bb0','#4f9aa0','#c77b4a','#7a7f8c'];
function suitOf(id){return SUITS.find(s=>s.id===id)||SUITS[0]}
function matOf(id){return MATS.find(s=>s.id===id)||MATS[0]}

function hairBack(x,y,r,st,col){c.fillStyle=col;
  if(st===2){rr(x-r*1.02,y-r*.3,r*2.04,r*2.1,r*.5);c.fill()}
  if(st===3){circ(x,y-r*1.18,r*.42);c.fill()}
  if(st===4){circ(x,y-r*.1,r*1.22);c.fill()}}
function hairFront(x,y,r,st,col){if(st===0)return;c.fillStyle=col;
  c.beginPath();c.ellipse(x,y-r*.03,r*.97,r*1.14,0,Math.PI,2*Math.PI);
  c.bezierCurveTo(x+r*.7,y-r*.62,x-r*.5,y-r*.42,x-r*.97,y-r*.03);c.closePath();c.fill();
  if(st===5){ell(x-r*.15,y-r*1.02,r*.72,r*.3,-.25);c.fill()}
  if(st===1){c.fillStyle=shade(col,1.12);ell(x+r*.3,y-r*.85,r*.3,r*.1,-.5);c.fill()}}

function person(x,y,r,o){
  const L=o.look,sk=SKINS[L.skin],hc=HAIRC[L.hairCol],mood=o.mood||'',f=o.outfit||{k:'casual',color:'#667'};
  const bottom=o.bottom||SH,sw=r*1.85,ty=y+r;
  c.save();
  // arms up (cheering)
  const body=f.k==='suit'?f.jacket:f.k==='robe'?'#15151a':f.k==='coat'?'#f4f6f8':f.color;
  if(o.arms){c.lineCap='round';c.strokeStyle=body;c.lineWidth=r*.62;
    for(const s of[-1,1]){c.beginPath();c.moveTo(x+s*sw*.82,ty+r*.3);c.lineTo(x+s*sw*1.12,ty-r*1.0);c.stroke();
      c.fillStyle=sk;circ(x+s*sw*1.12,ty-r*1.15,r*.3);c.fill()}}
  // neck

/* ================= trial flow ================= */
function pickClaims(level){
  const by=id=>CLAIMS.find(x=>x.id===id);
  if(level===1)return[by('tiptoe')];
  if(level===2)return[by('biceps')];
  if(level===3)return[by('neck'),by('knee')];
  const n=[1,1,2,2,3,3,3,4][Math.min(level-1,7)];
  const used=new Set(),out=[];let classes=shuffle([1,2,3]);
  for(let i=0;i<n;i++){const cl=classes[i%3];const pool=shuffle(CLAIMS.filter(x=>x.cls===cl&&!used.has(x.id)));
    const cl2=pool[0]||pick(CLAIMS.filter(x=>!used.has(x.id)));used.add(cl2.id);out.push(cl2)}
  return out;
}

    [{t:'Begin',c:'primary',f:()=>{sfx.gavel();G.gavelT=performance.now()/1000;showClaim()}},{t:'Skip to menu',f:openMenu}]);

  }else if(!r.lifted){

      [{t:'↺ Try again',c:'primary',f:()=>{G.expertTarget=0;G.youMood='';G.phase='arrange';G.bubble=true;G.labels=false;G.bubbleT=performance.now()/1000;resetTokens();refreshArrange()}}]);
  }else{

    banner('GUILTY!','#ff6b6b','Your client goes to jail',2.4);

      [{t:'↺ Retry this trial',c:'primary',f:()=>{startTrial(G.opts)}},{t:'Menu',f:openMenu}]);

function mistrial(mine,realTxt,r){
  G.phase='lost';showLabelled();G.expertTarget=1;G.juryMood='gasp';G.juryUntil=performance.now()/1000+2.5;G.judgeMood='angry';G.youMood='shock';G.profMood='';G.gavelT=performance.now()/1000;sfx.gavel();sfx.bad();

function afterClaim(){
  G.bubble=false;G.labels=false;
  const cl=G.claim,quizzes=[];
  if(G.detail>=1)quizzes.push(anatomyQ(cl));
  if(G.detail>=2)quizzes.push(maQ(cl));
  runQuiz(quizzes,()=>{const tr=G.trial;tr.idx++;if(tr.idx>=tr.claims.length)trialWon();else{G.expertTarget=0;showClaim()}});
}
function anatomyQ(cl,key){
  const roles=[['F','Fulcrum (axis)','F'],['E','Effort','Ef'],['L','Load (resistance)','Lo']],ro=key?roles.find(r=>r[0]===key):pick(roles.slice(1));
  const others=shuffle(CLAIMS.filter(x=>x[ro[2]]!==cl[ro[2]]&&x.id!==cl.id));const seen=new Set([cl[ro[2]]]),opts=[cl[ro[2]]];
  for(const o of others){if(!seen.has(o[ro[2]])&&opts.length<3){seen.add(o[ro[2]]);opts.push(o[ro[2]])}}
  return{q:'In the <b>'+cl.joint+'</b> lever, which is the <b>'+ro[1]+'</b>?',opts:shuffle(opts),ans:cl[ro[2]],why:''};
}
function maQ(cl){
  const o=['MA is always greater than 1 (force advantage)','MA is always less than 1 (speed / range advantage)','MA is always equal to 1','MA can be less than, equal to or greater than 1'];
  const ans=cl.cls===2?o[0]:cl.cls===3?o[1]:o[3];
  const why=cl.cls===2?'In a 2nd-class lever the effort arm is always longer than the load arm, so MA &gt; 1.':cl.cls===3?'In a 3rd-class lever the effort arm is always shorter than the load arm, so MA &lt; 1: it trades force for speed and range of motion.':'In a 1st-class lever it depends on where the fulcrum sits, so MA can be &lt;, = or &gt; 1.';
  return{q:'<b>Expert question:</b> mechanical advantage = effort arm ÷ load arm. For a <b>'+ord[cl.cls]+'-class</b> lever like the '+cl.joint+', which statement is true?',opts:shuffle(o),ans,why};
}
function runQuiz(list,done){
  if(!list.length)return done();
  const q=list.shift(),who=q.who||'Expert';if(who==='Expert')G.expertTarget=1;G.phase='quiz';
  const acts=q.opts.map(o=>({t:o,f:()=>{
    const ok=o===q.ans;if(q.recall)S.recall[q.cls][ok?'ok':'bad']++;else S.quiz[ok?'ok':'bad']++;
    const gain=q.gain||10;
    if(ok){addRep(gain);floater('+'+gain+' rep','#ffe27a',110,330);sfx.cheer()}else{sfx.bad()}
    ui(who,ok?'✔ Correct! '+q.why:(q.recall?'✘ Not quite. The court notes your answer; let\'s see how the evidence plays out.':'✘ Not quite. The answer is: <b>'+q.ans+'</b>. '+q.why),'',[{t:'Continue',c:'primary',f:()=>{G.expertTarget=0;runQuiz(list,done)}}]);save()}}));
  ui(who,q.q,q.info||'The expert witness quizzes you before the court moves on (+10 rep for a correct answer).',acts);
}
function trialWon(){
  const tr=G.trial,bonus=tr.custom?30:40+10*tr.level;addRep(bonus);if(!tr.custom){S.best=Math.max(S.best,tr.level);S.level=tr.level+1}save();hud();
  G.phase='won';G.juryMood='cheer';G.juryUntil=performance.now()/1000+4;G.youMood='cheer';G.clientMood='cheer';G.profMood='angry';G.judgeMood='';G.gavelT=performance.now()/1000;sfx.gavel();setTimeout(sfx.cheer,300);
  banner('NOT GUILTY!','#7cf0b8','Case dismissed',2.4);floater('+'+bonus+' rep','#ffe27a',110,330);
  ui('Judge','The jury has seen the physics. <b>Not guilty</b>; the case is dismissed! You earned <b>'+bonus+' reputation</b>.',
    'Spend reputation on new suits and see-saws in the shop. Next up: Trial '+S.level+' ('+(S.level<3?'1':[0,0,0,'2','2','3','3','3'][Math.min(S.level,7)]||'4')+' claim'+(S.level<3?'':'s')+').',

function toStage(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*SW,y:(e.clientY-r.top)/r.height*SH}}
function hitToken(p){let best=null,bd=1e9;for(const id of['L','E','F']){const t=tokens[id],q=tokenCenter(t),d=Math.hypot(p.x-q.x,p.y-q.y);if(d<62&&d<bd){bd=d;best=t}}return best}
function nearSlot(p){let b=-1,bd=1e9;for(let i=0;i<3;i++){const d=Math.hypot(p.x-SLOTX[i],p.y-(BEAMY-20));if(d<125&&d<bd){bd=d;b=i}}return b}
function placeInto(t,slot){
  const old=t.slot;const other=Object.values(tokens).find(o=>o!==t&&o.slot===slot);
  if(other)other.slot=old;t.slot=slot;sfx.place();refreshArrange();
}
cv.addEventListener('pointerdown',e=>{
  if(G.phase!=='arrange')return;
  const p=toStage(e),t=hitToken(p);
  if(t){cv.setPointerCapture(e.pointerId);drag={t,x:p.x,y:p.y,sx:p.x,sy:p.y,t0:performance.now(),moved:false};e.preventDefault()}
  else if(sel){const s=nearSlot(p);if(s>=0){placeInto(sel,s);sel=null}else sel=null}
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=toStage(e);drag.x=p.x;drag.y=p.y;if(Math.hypot(p.x-drag.sx,p.y-drag.sy)>14)drag.moved=true;e.preventDefault()});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;const p=toStage(e);
  if(cancel)return;
  if(!d.moved){ // tap
    if(sel===d.t)sel=null;else if(sel&&sel!==d.t){ // tap another token: swap positions
      const a=sel,b=d.t,sa=a.slot;a.slot=b.slot;b.slot=sa;sel=null;sfx.place();refreshArrange()}
    else sel=d.t;
    sfx.pick();return}
  const s=nearSlot(p);
  if(s>=0)placeInto(d.t,s);else{d.t.slot=-1;refreshArrange()}
  sel=null;
}
cv.addEventListener('pointerup',e=>endDrag(e,false));
cv.addEventListener('pointercancel',e=>endDrag(e,true));

  <p>The prosecutor makes a claim about what a body part can do. Build that joint as a <b>see-saw lever</b>: drag <b>F</b> (fulcrum), <b>E</b> (effort) and <b>L</b> (load) onto the three slots (or tap a token, then tap a slot), then <b>Present to the jury</b>.</p>

  m.appendChild(btn('📊 Decode student codes','primary',openDecode));
  m.appendChild(btn('📝 Custom claims editor ('+S.custom.length+')','',openCustom));
  m.appendChild(btn('Back','',()=>{closeModal();openMenu()}));
}
function openDecode(){
  const card=openModal('<h2>📊 Decode student codes</h2><p class="sub">Paste codes: one per line, or a whole column copied from your form or spreadsheet.</p><textarea id="din" class="txt" rows="5" placeholder="LL1.…"></textarea><div class="row"></div><div id="dout" style="overflow:auto;margin-top:10px"></div>');
  const ta=card.querySelector('#din'),out=card.querySelector('#dout'),row=card.querySelector('.row');let csv='';
  const pct=x=>(x[0]+x[1])?Math.round(x[0]/(x[0]+x[1])*100):null;
  const cell=x=>{const p=pct(x);return p===null?'<td>–</td>':'<td class="'+(p<60?'h-r':p<80?'h-a':'h-g')+'">'+p+'% <small>('+x[0]+'/'+(x[0]+x[1])+')</small></td>'};
  function run(){
    const ms=[...ta.value.matchAll(/LL1\.([A-Za-z0-9_-]+)\.([0-9a-z]{4})/g)];
    if(!ms.length){out.innerHTML='<p class="sub">No codes found.</p>';csv='';return}
    let h='<table class="st dec"><tr><th>Name</th><th>Rank</th><th>Rep</th><th>Best trial</th><th>Recall 1st</th><th>Recall 2nd</th><th>Recall 3rd</th><th>See-saw 1st</th><th>See-saw 2nd</th><th>See-saw 3rd</th><th>Expert Qs</th><th>Date</th></tr>';
    const lines=[['Name','Rank','Rep','Best trial','Recall 1st %','Recall 2nd %','Recall 3rd %','Seesaw 1st %','Seesaw 2nd %','Seesaw 3rd %','Expert Qs %','Date']];
    for(const m of ms){let o=null;try{const j=b64d(m[1]);if(chk(j)===m[2])o=JSON.parse(j)}catch(e){}
      if(!o){h+='<tr><td colspan="12">⚠ Invalid or altered code: '+esc(m[0].slice(0,24))+'…</td></tr>';continue}
      h+='<tr><td>'+esc(o.n)+'</td><td>'+esc(o.rk)+'</td><td>'+o.rep+'</td><td>'+o.b+'</td>'+o.rc.map(cell).join('')+o.t.map(cell).join('')+cell(o.q)+'<td>'+esc(o.d)+'</td></tr>';
      lines.push([o.n,o.rk,o.rep,o.b].concat(o.rc.map(pct),o.t.map(pct),[pct(o.q),o.d]).map(v=>'"'+String(v===null?'':v).replace(/"/g,'""')+'"'));
    }
    out.innerHTML=h+'</table><p class="sub">Red below 60%, amber 60–79%, green 80% and above. Codes are checksummed but this is a review tool, not a secure exam.</p>';
    csv=lines.map(l=>l.join(',')).join('\n')}
  row.appendChild(btn('Decode','primary',run));
  row.appendChild(btn('📋 Copy as CSV','',()=>{if(!csv)run();const t=document.createElement('textarea');t.value=csv;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);copyText(t);t.remove()}));
  row.appendChild(btn('Back','',openTeacher));
}
function shamOK(cls,E,L){return E>0&&L>0&&E*({1:1,2:2,3:.5}[cls])<L}
function cleanClaim(x){
  const t=(v,n)=>esc(unesc(String(v==null?'':v)).trim().slice(0,n));
  const cls=+x.cls,E=+x.E,L=+x.L;
  if(![1,2,3].includes(cls)||!(E>0)||!(L>0)||!shamOK(cls,E,L))return null;
  const o={id:t(x.id||('c_'+Date.now()+Math.random().toString(36).slice(2,6)),40),joint:t(x.joint,80),cls,E,L,say:t(x.say,300),F:t(x.F,200),Ef:t(x.Ef,200),Lo:t(x.Lo,200),custom:true};
  return(o.joint&&o.say&&o.F&&o.Ef&&o.Lo)?o:null}
function openCustom(){
  const card=openModal(`<h2>📝 Custom claims</h2><p class="sub">Write your own sham claims. They appear in trials from level 4 on, and in <b>Practice custom claims</b> on the menu. They are saved on this device; use the share code to give them to students (they paste it into the Import box).</p>
  <div id="cl"></div><h3>Add a claim</h3>
  <div class="grp"><label>Joint / action</label><input class="txt" id="f_joint" maxlength="80" placeholder="Wrist (flicking a coin)"></div>
  <div class="grp"><label>True lever class</label><select class="txt" id="f_cls"><option value="1">1st class</option><option value="2">2nd class</option><option value="3">3rd class</option></select></div>
  <div class="grp"><label>Effort available (kgf) · Load (kgf)</label><div class="chips"><input class="txt" style="width:110px" id="f_E" type="number" min="1" placeholder="Effort"><input class="txt" style="width:110px" id="f_L" type="number" min="1" placeholder="Load"></div><div class="sub" id="f_hint"></div></div>
  <div class="grp"><label>Prosecutor's claim</label><textarea class="txt" id="f_say" rows="2" maxlength="300" placeholder="The accused …"></textarea></div>
  <div class="grp"><label>Fulcrum</label><input class="txt" id="f_F" maxlength="200"></div>
  <div class="grp"><label>Effort</label><input class="txt" id="f_Ef" maxlength="200"></div>
  <div class="grp"><label>Load</label><input class="txt" id="f_Lo" maxlength="200"></div>
  <p class="sub" id="f_msg" style="color:#ffb3b3"></p><div class="row" id="r1"></div>
  <h3>Share</h3><div class="grp"><label>Share code (copy to students) / paste code to import</label><textarea class="txt" id="f_share" rows="3"></textarea></div><p class="sub" id="f_smsg"></p><div class="row" id="r2"></div>`);
  const $f=id=>card.querySelector('#'+id),list=$f('cl'),share=$f('f_share'),msg=$f('f_msg');
  function hint(){const cls=+$f('f_cls').value,L=+$f('f_L').value;$f('f_hint').textContent=L>0?'For the claim to be impossible, effort must be below '+(L/({1:1,2:2,3:.5}[cls]))+' kgf (slots are 10 cm apart in this model).':'Pick numbers so the correct lever cannot lift the load: 1st class needs E < L, 2nd class E < L ÷ 2, 3rd class E < 2 × L.'}
  function render(){
    list.innerHTML=S.custom.length?'':'<p class="sub">No custom claims yet.</p>';
    S.custom.forEach((x,i)=>{const d=document.createElement('div');d.className='cli';d.innerHTML='<span><b>'+x.joint+'</b> · '+ord[x.cls]+' class · E '+x.E+' / L '+x.L+'</span>';
      d.appendChild(btn('✕','bad',()=>{S.custom.splice(i,1);rebuildClaims();save();render()}));list.appendChild(d)});
    share.value=S.custom.length?'LLC1.'+b64e(JSON.stringify(S.custom)):'';hint()}
  ['f_cls','f_L'].forEach(id=>{$f(id).oninput=hint;$f(id).onchange=hint});
  $f('r1').appendChild(btn('➕ Add claim','primary',()=>{
    const x={joint:$f('f_joint').value,cls:$f('f_cls').value,E:$f('f_E').value,L:$f('f_L').value,say:$f('f_say').value,F:$f('f_F').value,Ef:$f('f_Ef').value,Lo:$f('f_Lo').value};
    const o=cleanClaim(x);
    if(!o){msg.textContent=(+x.E>0&&+x.L>0&&!shamOK(+x.cls,+x.E,+x.L))?'Not a sham yet: with the correct lever the effort would win. Lower the effort or raise the load (see the hint above).':'Please fill in every field with valid numbers.';return}
    msg.textContent='';S.custom.push(o);rebuildClaims();save();['f_joint','f_E','f_L','f_say','f_F','f_Ef','f_Lo'].forEach(id=>$f(id).value='');render()}));
  $f('r2').appendChild(btn('📋 Copy share code','',()=>copyText(share,$f('f_smsg'))));
  $f('r2').appendChild(btn('⬇ Import pasted code','',()=>{
    const m=share.value.match(/LLC1\.([A-Za-z0-9_-]+)/);let n=0,bad=0;
    try{if(!m)throw 0;const arr=JSON.parse(b64d(m[1]));if(!Array.isArray(arr))throw 0;
      for(const x of arr){const o=cleanClaim(x);if(!o){bad++;continue}const i=S.custom.findIndex(c=>c.id===o.id);if(i>=0)S.custom[i]=o;else S.custom.push(o);n++}
      rebuildClaims();save();render();$f('f_smsg').textContent='Imported '+n+' claim'+(n===1?'':'s')+(bad?' ('+bad+' skipped as invalid)':'')+' ✔'}
    catch(e){$f('f_smsg').textContent='That does not look like a valid share code.'}}));
  const back=document.createElement('div');back.className='row';back.appendChild(btn('Back','primary',openTeacher));card.appendChild(back);
  render();
}

/* ================= boot ================= */
function boot(){
  load();hud();newCast();
  G.phase='idle';G.detail=0;G.claim=null;
  ui('Court','Welcome to the courtroom, counsel! Open the menu to begin.','',[{t:'☰ Menu',c:'primary',f:openMenu}]);
  if(!S.created)openCustomize(true);else openMenu();
}
$('#bMenu').onclick=openMenu;
$('#bSnd').onclick=()=>{S.muted=!S.muted;save();hud()};
window.addEventListener('resize',resize);
new ResizeObserver(resize).observe(cv);
resize();boot();requestAnimationFrame(frame);
window.__LL={G,tokens,evaluate,get CLAIMS(){return CLAIMS},startTrial,present,showClaim,get S(){return S},makeCode,b64d,chk};
})();
</script>
